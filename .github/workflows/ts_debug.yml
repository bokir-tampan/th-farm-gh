name: ts-debug

on:
  workflow_dispatch:
    inputs:
      base:
        required: true
        default: 'https://sudoflow.top'

permissions:
  contents: read

jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --quiet camoufox[geoip]
          python -m camoufox fetch
      - run: python3 tsdebug.py "${{ github.event.inputs.base }}"
      - name: Shot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsdebug-shot
          path: /tmp/tsdebug.png
          if-no-files-found: ignore