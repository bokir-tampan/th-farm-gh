name: oauth convert
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --quiet "camoufox[geoip]" curl_cffi
          python -m camoufox fetch
      - name: Verify password
        working-directory: grok-farm
        run: timeout 600 python verify_login.py 2>&1 | tee vl.log || true
      - name: OAuth convert
        working-directory: grok-farm
        run: timeout 900 python oauth_convert.py 2>&1 | tee oc.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth
          path: |
            grok-farm/vl.log
            grok-farm/oc.log
            grok-farm/grok_oauth.json
