name: device probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --quiet "camoufox[geoip]" curl_cffi requests
          python -m camoufox fetch
      - name: Probe
        working-directory: grok-farm
        run: timeout 500 python device_probe.py 2>&1 | tee dp.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: device-probe, path: grok-farm/dp.log}
