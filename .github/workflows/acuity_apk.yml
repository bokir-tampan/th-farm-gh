name: acuity-apk
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mirrors
        run: |
          mkdir -p apk && cd apk
          UA="Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          try() { echo "### $1"; curl -s -A "$UA" -L "$1" -o out.bin -w "http=%{http_code} size=%{size_download} ct=%{content_type}\n"; file out.bin; if file out.bin | grep -qi zip; then cp out.bin "$2"; fi; }
          try "https://d.apkpure.com/b/APK/com.acuityai?version=latest" a1.apk
          try "https://apkpure.com/acuity-studios/com.acuityai/download/apk" a2.html
          try "https://apkcombo.com/acuity-studios/com.acuityai/download/apk" a3.html
          try "https://apkfab.com/acuity-studios/com.acuityai/apk" a4.html
          try "https://apksos.com/app/com.acuityai" a5.html
          try "https://apkgk.com/com.acuityai" a6.html
          try "https://apk.support/app/com.acuityai" a7.html
          try "https://androidappsapk.co/download/com.acuityai" a8.html
          ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acuity-apk
          path: apk/
          if-no-files-found: warn
