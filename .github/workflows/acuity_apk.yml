name: acuity-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apkeep
        run: |
          curl -sL -o apkeep "https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu"
          chmod +x apkeep
          ./apkeep --version || true
      - name: Try downloaders
        run: |
          mkdir -p apk && cd apk
          for d in apk-pure google-play; do
            echo "=== $d ==="
            ../apkeep -a com.acuityai -d $d . 2>&1 | tail -6 || true
          done
          ls -la
          file * 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acuity-apk
          path: apk/
          if-no-files-found: warn
