name: domain test fast

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domain dipisah spasi'
        required: true

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "camoufox[geoip]" curl_cffi
          python -m camoufox fetch
      - name: Test shard
        working-directory: grok-farm
        env:
          DOMS: ${{ github.event.inputs.domains }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          doms = os.environ['DOMS'].split()
          sh = int(os.environ['SHARD'])
          mine = doms[sh::4]
          if not mine:
              print("shard kosong"); raise SystemExit(0)
          open('/tmp/mine.txt','w').write("\n".join(mine))
          print("shard", sh, "->", mine, flush=True)
          PY
          if [ -s /tmp/mine.txt ]; then
            timeout 1200 python domain_tester.py $(cat /tmp/mine.txt) 2>&1 | tee shard-${{ matrix.shard }}.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: grok-farm/shard-*.log
          if-no-files-found: warn
          retention-days: 3