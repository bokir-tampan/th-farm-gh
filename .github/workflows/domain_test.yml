name: grok domain test

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domain dipisah spasi (kosong = daftar default)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "camoufox[geoip]" curl_cffi
          python -m camoufox fetch

      - name: IP
        run: curl -s https://ipv4.icanhazip.com; echo

      - name: Test domains
        working-directory: grok-farm
        env:
          DOMS: ${{ github.event.inputs.domains }}
        run: |
          timeout 1500 python domain_tester.py ${DOMS} 2>&1 | tee domtest.log || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test
          path: |
            grok-farm/domtest.log
            grok-farm/domain_ok.txt
          if-no-files-found: warn
          retention-days: 3