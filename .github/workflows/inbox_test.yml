name: inbox api test 2
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: IP
        run: curl -s https://ipv4.icanhazip.com; echo
      - name: Run
        working-directory: grok-farm
        run: python inbox_api_test2.py 2>&1 | tee inbox.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-log
          path: grok-farm/inbox.log
