name: verify login
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --quiet "camoufox[geoip]" curl_cffi
          python -m camoufox fetch
      - name: Verify
        working-directory: grok-farm
        run: timeout 900 python verify_login.py 2>&1 | tee vl.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vl
          path: grok-farm/vl.log
