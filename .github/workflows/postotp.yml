name: postotp probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --quiet "camoufox[geoip]" curl_cffi
          python -m camoufox fetch
      - name: Probe
        working-directory: grok-farm
        run: timeout 800 python postotp_probe.py 2>&1 | tee po.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postotp
          path: grok-farm/po.log
