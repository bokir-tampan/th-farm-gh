name: oauth http
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: Convert
        working-directory: grok-farm
        run: timeout 500 python oauth_http.py 2>&1 | tee oh.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-http
          path: |
            grok-farm/oh.log
            grok-farm/grok_oauth.json
